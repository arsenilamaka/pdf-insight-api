# Optional: deploy with `npx wrangler deploy` from this folder.
# The key is never stored here: `npx wrangler secret put GEMINI_API_KEY`
name = "pdf-insight-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Production: only the published GitHub Pages origin (no path, no localhost)
ALLOWED_ORIGINS = "https://arsenilamaka.github.io"
GEMINI_MODEL = "gemini-flash-latest"
